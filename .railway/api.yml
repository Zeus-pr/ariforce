# Railway configuration for API service
# No Docker needed - uses Railway's native Node.js runtime

name: ariforce-api
runtime: node:22
memory: 512MB
cpu: 0.5

build:
  buildCommand: npm ci && npm run build --workspace=api
  startCommand: cd apps/api && npm start

environment:
  NODE_ENV: production
  PORT: 4000

# Link to database if using Railway's PostgreSQL
services:
  - postgres  # If using Railway's database

health:
  path: /v1/health
  interval: 30s
  timeout: 3s
