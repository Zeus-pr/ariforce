# Railway configuration for Web service
# Uses Railway's Node.js runtime with Next.js optimization

name: ariforce-web
runtime: nodejs
memory: 512MB
cpu: 0.5

build:
  buildCommand: npm ci && npm run build --workspace=web
  startCommand: cd apps/web && PORT=3000 npm start

environment:
  NODE_ENV: production
  NEXT_PUBLIC_API_MODE: real
  NEXT_PUBLIC_API_BASE_URL: https://ariforce-api.railway.app

# Link to API service
services:
  - ariforce-api

health:
  path: /sign-in
  interval: 30s
  timeout: 3s
