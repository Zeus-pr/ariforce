name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # .npmrc pins pnpm dirs to the Mac SSD; CI overrides them to runner paths.
  npm_config_store_dir: /home/runner/.pnpm-store
  npm_config_cache: /home/runner/.npm
  npm_config_cache_dir: /home/runner/.cache/pnpm
  npm_config_state_dir: /home/runner/.local/state/pnpm
  npm_config_global_dir: /home/runner/.local/share/pnpm/global
  npm_config_global_bin_dir: /home/runner/.local/share/pnpm/bin
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/ariforce
  DATABASE_URL_APP: postgres://ariforce_app:ariforce_app@localhost:5432/ariforce
  BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
  BETTER_AUTH_URL: http://localhost:4000

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ariforce
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: OpenAPI document is up to date
        run: pnpm -r --if-present run openapi:check
      - name: Migrate + seed test database
        run: |
          pnpm -r --if-present run db:migrate
          pnpm -r --if-present run db:seed
      - name: Unit + DB/RLS/API integration tests
        run: pnpm test
      - run: pnpm build
